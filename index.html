<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>A Birthday Letter</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2a1116;color:#55473e}body,button,textarea{font-family:Georgia,"Times New Roman",serif}
    .site{min-height:100svh;overflow:hidden}.cover,.inside{position:absolute;inset:0;min-height:100svh}.cover{z-index:3;overflow:hidden;background:#2a1116;transition:.4s}.cover:before{content:"";position:absolute;inset:0;background:url("birthday-cover.jpg") center/cover no-repeat;filter:saturate(.88) brightness(.92)}
    .birthday-line{position:absolute;top:max(34px,7vh);left:50%;width:90%;margin:0;transform:translateX(-50%);color:#782b3d;text-align:center;font-size:clamp(12px,2.2vw,18px);font-style:italic;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 1px 0 #f5e8dc80}
    .open{position:absolute;left:50%;bottom:max(42px,7vh);transform:translateX(-50%);padding:10px 2px;border:0;border-bottom:1px solid #f8ece08c;background:transparent;color:#f4e9df;font-size:11px;font-style:italic;letter-spacing:.13em;cursor:pointer}
    .music-dish{position:fixed;z-index:8;top:max(10px,env(safe-area-inset-top));right:8px;width:132px;height:88px;filter:drop-shadow(0 5px 8px #2b111838)}.music-player{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer}.dish-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.dish-cover{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #f5efe6;border-radius:50%;object-fit:cover;box-shadow:inset 0 0 0 2px #8d766152}.music-player:after{content:"▶";position:absolute;left:50%;top:50%;display:grid;width:44%;aspect-ratio:1;place-items:center;transform:translate(-50%,-50%);border-radius:50%;background:#38221e47;color:#fffdf8;font-size:11px;text-indent:2px;transition:.25s}.music-player.playing .dish-cover{animation:record-spin 8s linear infinite}.music-player.playing:after{content:"Ⅱ";text-indent:0;opacity:.66}.music-player.paused .dish-cover{animation-play-state:paused}.music-next{position:absolute;right:2px;bottom:-3px;width:23px;height:23px;padding:0;border:1px solid #c9b9a6;border-radius:50%;background:#f1e9dc;color:#71584e;font-family:Georgia,serif;font-size:17px;line-height:20px;box-shadow:0 2px 7px #2b11182e;cursor:pointer}.music-next:active{transform:scale(.92)}@keyframes record-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .inside{display:grid;place-items:center;overflow:auto;padding:18px;background:#9e8e78;opacity:0;transition:.4s}.is-open .cover{visibility:hidden;opacity:0;pointer-events:none}.is-open .inside{opacity:1}
    .book{position:relative;width:min(94vw,620px);aspect-ratio:454/726;perspective:1800px}.upload-page,.memory-page,.fortune-page,.result-page{position:absolute;inset:0;overflow:auto;box-shadow:0 18px 50px #271a1638;background:linear-gradient(#e8d5b2b8,#ddc79fba),url("birthday-inner.jpg") center/cover}
    .upload-page{z-index:4;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10%;transform-origin:left;transition:transform .75s,opacity .55s}.page3 .upload-page,.page4 .upload-page,.page5 .upload-page{transform:rotateY(-165deg);opacity:0;pointer-events:none}.memory-page{z-index:3;padding:7% 9% 10%;transition:opacity .45s,transform .65s;transform-origin:left}.memory-page form{display:flex;align-items:center;flex-direction:column;width:100%}.page4 .memory-page,.page5 .memory-page{opacity:0;transform:rotateY(-155deg);pointer-events:none}
    .upload-photo,.photo,.writing{position:relative;aspect-ratio:4/3;border:1px solid #715e473d;box-shadow:0 8px 20px #5a483226}.upload-photo{width:100%;padding:11px;background:#c7a77f url("photo-paper.webp") center/cover}.photo{width:82%;padding:11px;background:#c7a77f url("photo-paper.webp") center/cover}.upload-photo img,.upload-photo label,.photo img{display:flex;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column}.upload-photo img,.photo img{object-fit:contain;filter:saturate(.82) contrast(.94)}.upload-photo img,.photo img{box-shadow:0 2px 8px #49352438}.upload-photo label{cursor:pointer;font-size:12px;font-style:italic}.upload-photo small{margin-top:7px;font-size:8px;letter-spacing:.12em}
    .writing{width:82%;margin-top:5%;padding:20% 9% 7%;background:#c5a375 url("postcard-writing.webp") center/cover}.writing textarea{width:100%;height:100%;resize:none;outline:0;border:0;background:transparent;color:#563e2f;font-family:"Segoe Print","Bradley Hand",cursive;font-size:clamp(10px,2vw,14px);line-height:1.55}input,[hidden],iframe{display:none!important}
    .actions,.upload-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:8%}.actions label,.actions button,.upload-actions label,.upload-actions button{padding:5px 0;border:0;border-bottom:1px solid #5a483a59;background:transparent;color:#65554b;font-size:9px;font-style:italic;cursor:pointer}
    .send-status{min-height:1.5em;margin:12px 0 0;text-align:center;color:#715447;font-size:10px;font-style:italic;letter-spacing:.04em}
    .page3 .photo{animation:polaroid-in .9s cubic-bezier(.2,.8,.25,1) both}
    @keyframes polaroid-in{0%{opacity:0;transform:translateY(-42px) scale(.92)}65%{opacity:1;transform:translateY(5px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
    .fortune-page,.result-page{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10%;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .65s}.page4 .fortune-page{z-index:3;opacity:1;pointer-events:auto}.page5 .fortune-page{transform:rotateY(-155deg)}.page5 .result-page{z-index:3;opacity:1;pointer-events:auto}.oracle-kicker{margin:0 0 7%;font-size:9px;font-style:italic;letter-spacing:.25em;text-transform:uppercase}.butterfly{display:block;width:min(68%,360px);height:auto;filter:drop-shadow(0 13px 15px #57403138);transform-origin:50% 62%;will-change:transform,filter}.butterfly.shaking{animation:butterfly-draw 1.4s cubic-bezier(.3,.7,.25,1)}.draw-button,.fortune-nav button{padding:7px 1px;border:0;border-bottom:1px solid #65534470;background:transparent;color:#654c42;font-size:11px;font-style:italic;letter-spacing:.12em;cursor:pointer}.draw-button{margin-top:5%}@keyframes butterfly-draw{0%{transform:translateY(0) scale(1);filter:drop-shadow(0 13px 15px #57403138)}24%{transform:translateY(-5px) rotate(-.6deg) scaleX(.985) scaleY(1.01)}45%{transform:translateY(-11px) rotate(.5deg) scaleX(1.018) scaleY(.995);filter:drop-shadow(0 18px 20px #b08a6260)}66%{transform:translateY(-14px) rotate(-.25deg) scaleX(.992) scaleY(1.012);filter:drop-shadow(0 20px 24px #c3a27878)}82%{transform:translateY(-7px) scaleX(1.008) scaleY(1)}100%{transform:translateY(0) scale(1);filter:drop-shadow(0 13px 15px #57403138)}}.fortune-result{max-width:430px;color:#66483f}.fortune-result-zh{margin:0;font-family:"Songti SC","STSong","FangSong","STKaiti","KaiTi",serif;font-size:clamp(20px,4.6vw,29px);font-weight:400;line-height:1.9;letter-spacing:.08em}.fortune-result-en{margin:8% 0 0;color:#80685d;font-family:Georgia,"Times New Roman",serif;font-size:clamp(12px,2.5vw,16px);font-style:italic;line-height:1.75;letter-spacing:.035em}.fortune-mark{margin:0 0 10%;color:#806358;font-size:28px}.fortune-nav{display:flex;gap:22px;margin-top:14%}
    @media(max-width:620px){.music-dish{top:max(7px,env(safe-area-inset-top));right:3px;width:112px;height:75px}.inside{padding:0}.book{width:100vw;min-height:100svh;aspect-ratio:auto}.memory-page{padding:7vh 8vw 9vh}.upload-photo{width:min(84vw,480px);margin-right:auto;margin-left:auto}.photo,.writing{width:min(72vw,380px);margin-right:auto;margin-left:auto}.writing{margin-top:4vh;padding:20% 9% 7%}.butterfly{width:min(72vw,360px)}}
  </style>
</head>
<body>
  <div class="music-dish">
    <button class="music-player" id="music-player" type="button" aria-label="play music" title="play / pause">
      <img class="dish-frame" src="player-frame.webp" alt="" decoding="async">
      <img class="dish-cover" id="music-cover" src="music-cover.webp" alt="" decoding="async">
    </button>
    <button class="music-next" id="music-next" type="button" aria-label="next song" title="change song">›</button>
  </div>
  <audio id="music" src="moonlight-romance.ogg" preload="auto" autoplay></audio>
  <main class="site" id="site">
    <section class="cover"><p class="birthday-line">Happy Birthday · A Letter For You</p><button class="open" id="open">open the letter</button></section>
    <section class="inside">
      <div class="book" id="book">
        <div class="upload-page">
          <div class="upload-photo">
            <label id="picker"><span>add a photograph</span><small>landscape · 4:3</small><input id="file" type="file" accept="image/*"></label>
            <img id="preview" alt="Selected birthday memory" style="width:100%;height:100%;object-fit:contain;object-position:center" hidden>
          </div>
          <div class="upload-actions"><label id="replace" hidden>change photo<input id="file2" type="file" accept="image/*"></label><button id="turn" hidden>turn the page</button><button id="close2">close</button></div>
        </div>
        <div class="memory-page">
          <div class="photo"><img id="photo" alt="A birthday memory" style="width:100%;height:100%;object-fit:contain;object-position:center" hidden></div>
          <form id="letter-form" action="https://formsubmit.co/6629cfc9a85e60bac93bbc85d405f893" method="POST">
            <input type="hidden" name="_subject" value="收到一封生日匿名来信">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" tabindex="-1" autocomplete="off">
            <div class="writing"><textarea id="note" name="匿名留言" required maxlength="3000" placeholder="write something here…"></textarea></div>
            <p class="send-status" id="send-status"></p>
            <div class="actions"><button type="button" id="back">turn back</button><button type="submit" id="send">send anonymously</button><button type="button" id="to-fortune">draw a blessing</button><button type="button" id="close">close</button></div>
          </form>
          <iframe name="submit-frame" title="anonymous letter submission"></iframe>
        </div>
        <div class="fortune-page">
          <p class="oracle-kicker">a birthday oracle</p>
          <img class="butterfly" id="butterfly" src="butterfly.webp" alt="Golden butterfly" loading="lazy" decoding="async">
          <button class="draw-button" id="draw" type="button">draw a blessing</button>
          <div class="fortune-nav"><button id="fortune-back" type="button">turn back</button></div>
        </div>
        <div class="result-page">
          <p class="fortune-mark">✦</p>
          <div class="fortune-result"><p class="fortune-result-zh" id="fortune-result-zh" lang="zh-CN"></p><p class="fortune-result-en" id="fortune-result-en" lang="en"></p></div>
          <div class="fortune-nav"><button id="draw-again" type="button">draw again</button><button id="result-close" type="button">close</button></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const $=s=>document.querySelector(s),site=$("#site"),book=$("#book"),photo=$("#photo"),preview=$("#preview"),picker=$("#picker"),note=$("#note"),replace=$("#replace"),turn=$("#turn");
    function setPage(page){book.classList.remove("page3","page4","page5");if(page)book.classList.add(page);document.querySelector(".inside").scrollTop=0;document.querySelectorAll(".memory-page,.fortune-page,.result-page").forEach(el=>el.scrollTop=0)}
    $("#open").onclick=async()=>{site.classList.add("is-open");if(music.paused){try{await music.play();musicPlayer.classList.add("playing");musicPlayer.classList.remove("paused");musicPlayer.setAttribute("aria-label","pause music")}catch(error){}}};turn.onclick=()=>setPage("page3");$("#back").onclick=()=>setPage("");function closeAll(){site.classList.remove("is-open");setPage("")}$("#close").onclick=closeAll;$("#close2").onclick=closeAll;
    function show(src){preview.src=photo.src=src;preview.hidden=photo.hidden=false;picker.hidden=true;replace.hidden=turn.hidden=false}
    function load(file){if(!file)return;const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);show(c.toDataURL("image/jpeg",.88))};im.src=r.result};r.readAsDataURL(file)}
    $("#file").onchange=e=>load(e.target.files[0]);$("#file2").onchange=e=>load(e.target.files[0]);
    const letterForm=$("#letter-form"),send=$("#send"),sendStatus=$("#send-status");
    letterForm.addEventListener("submit",async e=>{
      e.preventDefault();
      if(!note.value.trim()){e.preventDefault();sendStatus.textContent="write a little something first";note.focus();return}
      send.disabled=true;sendStatus.textContent="sending…";
      try{
        const response=await fetch("https://formsubmit.co/ajax/6629cfc9a85e60bac93bbc85d405f893",{
          method:"POST",
          headers:{"Content-Type":"application/json","Accept":"application/json"},
          body:JSON.stringify({"匿名留言":note.value.trim(),"_subject":"收到一封生日匿名来信","_template":"table","_captcha":"false"})
        });
        const result=await response.json();
        if(!response.ok||result.success===false)throw new Error("submission rejected");
        sendStatus.textContent="your letter has been sent anonymously";
        note.value="";
      }catch(error){
        sendStatus.textContent="not sent — please check the network and try again";
      }finally{
        send.disabled=false;
      }
    });
    const blessings=[
      {zh:"你会在最普通的一天里，忽然收到很久以前许下的愿望。",en:"On an ordinary day, a long-ago wish will quietly find its way back to you."},
      {zh:"这一岁，会有人认真听懂你的言外之意，也珍惜你的欲言又止。",en:"Someone will understand the words you leave unspoken, and treasure every gentle pause."},
      {zh:"你走过的弯路会悄悄开花，替未来的你照亮一小段路。",en:"The winding roads behind you will bloom, lighting a little of the way ahead."},
      {zh:"新的故事正在靠近，它温柔、明亮，而且恰好与你有关。",en:"A new story is drawing near—tender, luminous, and beautifully meant for you."},
      {zh:"你会比想象中更自由，也会被比想象中更多的人温柔记住。",en:"You will become freer than you imagined, and be remembered more tenderly than you know."},
      {zh:"那些没有说出口的期待，会换一种更好的方式来到你身边。",en:"The hopes you never voiced will return to you in a lovelier form."},
      {zh:"今年的风会偏向你，把好消息一件一件送进你的怀里。",en:"This year, the wind will lean your way and carry good news into your arms."},
      {zh:"你不用追赶月亮，因为属于你的光正在慢慢亮起来。",en:"You need not chase the moon; the light meant for you is already beginning to glow."},
      {zh:"会有一场恰到好处的相遇，让你重新相信生活藏着惊喜。",en:"A perfectly timed encounter will remind you that life still keeps beautiful surprises."},
      {zh:"新的一岁，愿你被坚定选择，也永远保有转身离开的勇气。",en:"In this new year of you, may you be chosen with certainty and remain brave enough to walk away."}
    ];
    const butterfly=$("#butterfly"),fortuneResultZh=$("#fortune-result-zh"),fortuneResultEn=$("#fortune-result-en");
    $("#to-fortune").onclick=()=>setPage("page4");
    $("#fortune-back").onclick=()=>setPage("page3");
    $("#draw").onclick=()=>{
      if(butterfly.classList.contains("shaking"))return;
      butterfly.classList.add("shaking");
      setTimeout(()=>{const blessing=blessings[Math.floor(Math.random()*blessings.length)];fortuneResultZh.textContent=blessing.zh;fortuneResultEn.textContent=blessing.en;butterfly.classList.remove("shaking");setPage("page5")},1400);
    };
    $("#draw-again").onclick=()=>setPage("page4");
    $("#result-close").onclick=closeAll;
    const music=$("#music"),musicPlayer=$("#music-player"),musicCover=$("#music-cover"),musicNext=$("#music-next");
    const tracks=[
      {src:"moonlight-romance.ogg",cover:"music-cover.webp",start:2},
      {src:"valentine-mobile.mp3",cover:"valentine-cover.webp",start:0}
    ];
    let valentineReady=false;
    const warmValentine=()=>{if(valentineReady)return;valentineReady=true;fetch("valentine-mobile.mp3",{cache:"force-cache"}).catch(()=>{})};
    window.addEventListener("load",()=>setTimeout(warmValentine,1800),{once:true});
    let trackIndex=0;
    const currentTrack=()=>tracks[trackIndex];
    const showPlaying=()=>{musicPlayer.classList.add("playing");musicPlayer.classList.remove("paused");musicPlayer.setAttribute("aria-label","pause music")};
    const tryPlay=async()=>{try{await music.play();showPlaying()}catch(error){}};
    const loadTrack=async(index,play=true)=>{trackIndex=index;const track=currentTrack();music.src=track.src;musicCover.src=track.cover;music.load();music.addEventListener("loadedmetadata",()=>{if(music.duration>track.start)music.currentTime=track.start;if(play)tryPlay()},{once:true})};
    music.addEventListener("loadedmetadata",async()=>{const track=currentTrack();if(music.duration>track.start)music.currentTime=track.start;await tryPlay()},{once:true});
    music.addEventListener("ended",async()=>{music.currentTime=currentTrack().start;await tryPlay()});
    document.addEventListener("pointerdown",async event=>{if(event.target.closest(".music-dish"))return;if(music.paused)await tryPlay()},{once:true});
    musicPlayer.onclick=async()=>{
      if(music.paused){
        try{await music.play();showPlaying()}
        catch(error){musicPlayer.title="tap again to play"}
      }else{
        music.pause();musicPlayer.classList.add("paused");musicPlayer.setAttribute("aria-label","play music");
      }
    };
    musicNext.onclick=async event=>{event.stopPropagation();await loadTrack((trackIndex+1)%tracks.length,true)};
  </script>
</body>
</html>
